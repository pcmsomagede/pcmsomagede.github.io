:#39516f;padding:11px 15px;border-radius:13px;font-weight:800;cursor:pointer}.nav button.active{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 7px 18px rgba(6,42,99,.18)}.nav .accent{background:#fff8d8;border-color:#ffe58a;color:#7b5c00}
.prayer-wrap{background:linear-gradient(180deg,#f7f9fc,#eef4fb);border-bottom:1px solid var(--line);padding:10px 14px}
.prayer-widget{max-width:980px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:12px 16px;background:rgba(10,25,45,.94);border:1px solid rgba(255,255,255,.16);border-radius:20px;box-shadow:0 10px 28px rgba(4,25,55,.18);color:#fff}
.prayer-place{min-width:138px}.prayer-place strong{display:block;font-size:15px;letter-spacing:.02em}.prayer-date{display:block;margin-top:3px;font-size:12px;color:#cbd6e7}
.prayer-times{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.prayer-item{text-align:center;padding:7px 5px;border-radius:13px}.prayer-item .name{display:block;font-size:12px;color:#dbe6f5}.prayer-item .time{display:block;margin-top:3px;font-size:17px;font-weight:900;letter-spacing:.02em}.prayer-item.next{background:rgba(255,201,40,.15);outline:1px solid rgba(255,201,40,.35)}.prayer-item.next .name{color:#ffd95d}.prayer-item.next .time{color:#ffd95d}
.prayer-next{text-align:right;min-width:124px}.prayer-next span{display:block;font-size:11px;color:#b9c8dd}.prayer-next strong{display:block;margin-top:3px;color:#ffd95d;font-size:14px}

function render(){nav();const app=document.getElementById("app");const key=catKey();if(key==="Beranda"){const total=Object.values(DATA).reduce((n,a)=>n+a.length,0);app.innerHTML=`<section class="hero-grid"><div class="feature"><div class="eyebrow" style="color:#ffd84c">PUSTAKA DIGITAL MUHAMMADIYAH SOMAGEDE</div><h2>Pusat belajar, pustaka, dan materi dakwah dalam satu tempat.</h2><p>Semua menu dirancang sebagai katalog fungsional: cari materi, buka pratinjau lengkap, salin teks, dan unduh PDF/DOCX langsung dari browser.</p><div class="actions"><button class="btn btn-gold" onclick="go('pustaka')">Buka Pustaka Digital</button><button class="btn btn-soft" onclick="go('kitab-kuning')">Belajar Kitab Kuning</button></div></div><div class="mini-grid"><div class="mini"><span class="tag">QUR'AN</span><strong>Al-Qur'anMu</strong><div class="small">Katalog surat dengan teks Arab, terjemah, dan struktur siap audio.</div></div><div class="mini"><span class="tag">ILMU</span><strong>Kitab Kuning</strong><div class="small">Katalog kitab, preview materi, serta dokumen unduhan.</div></div><div class="mini"><span class="tag">SUNNAH</span><strong>Hadits</strong><div class="small">Koleksi hadits tematik dengan tampilan nyaman.</div></div><div class="mini"><span class="tag">DAKWAH</span><strong>Khutbah & Kultum</strong><div class="small">Naskah siap baca, salin, cetak, dan unduh.</div></div></div></section><section><div class="section-head"><div><div class="eyebrow">KATALOG</div><h2>Koleksi terpilih</h2><p class="lead">Pilih kategori di atas untuk membuka katalog penuh.</p></div></div><div class="stats"><div class="stat"><b>${total}</b><span class="small">Materi awal</span></div><div class="stat"><b>${cats.length-1}</b><span class="small">Kategori utama</span></div><div class="stat"><b>PDF</b><span class="small">Unduh offline</span></div><div class="stat"><b>DOCX</b><span class="small">Unduh offline</span></div></div></section>`;return}const items=DATA[key]||[];app.innerHTML=`<section><div class="section-head"><div><div class="eyebrow">${key}</div><h1>${key==="Al-Qur'anMu"?"Al-Qur'anMu — Digital Terjemah & Tilawah":key}</h1><p class="lead">${descFor(key)}</p></div><div class="tools"><input id="q" class="search" placeholder="Cari judul materi..." oninput="filterCards()"></div></div><div class="catalog" id="catalog">${items.map((x,i)=>card(key,i,x)).join("")}</div></section>`}

function downloadPDF(cat,i){const x=DATA[cat][i];const lines=[x.title,x.sub||"","",x.desc,"","Pimpinan Cabang Muhammadiyah Somagede"];const content=`BT /F1 16 Tf 50 760 Td (${esc(lines[0])}) Tj /F1 11 Tf 0 -28 Td (${esc(lines.slice(1).join(" | "))}) Tj ET`;const objs=["1 0 obj<< /Type /Catalog /Pages 2 0 R >>endobj","2 0 obj<< /Type /Pages /Kids [3 0 R] /Count 1 >>endobj","3 0 obj<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources<< /Font << /F1 4 0 R >> >> /Contents 5 0 R >>endobj","4 0 obj<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>endobj",`5 0 obj<< /Length ${content.length} >>stream\n${content}\nendstream endobj`];let pdf="%PDF-1.4\n",offs=[0];for(const o of objs){offs.push(pdf.length);pdf+=o+"\n"}const xref=pdf.length;pdf+=`xref\n0 6\n0000000000 65535 f \n${offs.slice(1).map(n=>String(n).padStart(10,"0")+" 00000 n ").join("\n")}\ntrailer<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;downloadBlob(new Blob([pdf],{type:"application/pdf"}),safe(x.title)+".pdf")}
function u16(n){return [n&255,(n>>>8)&255]}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function zipStore(files){const chunks=[],central=[];let off=0;for(const f of files){const name=new TextEncoder().encode(f.name),data=f.data,crc=crc32(data);const head=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);chunks.push(head,name,data);central.push({name,crc,size:data.length,off});off+=head.length+name.length+data.length}const coff=off,cdir=[];for(const f of central){const h=new Uint8Array([0x50,0x4b,1,2,20,0,20,0,0,0,0,0,0,0,...u32(f.crc),...u32(f.size),...u32(f.size),...u16(f.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(f.off)]);cdir.push(h,f.name);off+=h.length+f.name.length}const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(central.length),...u16(central.length),...u32(off-coff),...u32(coff),0,0]);return new Blob([...chunks,...cdir,end],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})}
function xml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function downloadDOCX(cat,i){const x=DATA[cat][i];const files=[["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`],["_rels/.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`],["word/document.xml",`<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>${xml(x.title)}</w:t></w:r></w:p><w:p><w:r><w:t>${xml(x.sub||"")}</w:t></w:r></w:p><w:p><w:r><w:t>${xml(x.desc)}</w:t></w:r></w:p><w:p><w:r><w:t>Pimpinan Cabang Muhammadiyah Somagede</w:t></w:r></w:p></w:body></w:document>`]];downloadBlob(zipStore(files.map(([name,s])=>({name,data:new TextEncoder().encode(s)}))),safe(x.title)+".docx")}

<script>
(function(){
  const LAT=-7.52272, LNG=109.33333, TZ=7, LOCATION='Jero Tengah · Somagede';
  const names=[['Subuh',20,'fajr'],['Terbit',-0.833,'sunrise'],['Dzuhur',0,'dhuhr'],['Ashar',null,'asr'],['Maghrib',-0.833,'sunset'],['Isya',18,'isha']];
  const elTimes=document.getElementById('prayer-times'), elNext=document.getElementById('prayer-next'), elDate=document.getElementById('prayer-date');
  if(!elTimes) return;
  if(elDate) elDate.textContent='Jero Tengah · Banyumas';

  const d2r=x=>x*Math.PI/180, r2d=x=>x*180/Math.PI;
  function dayOfYear(dt){const y=dt.getFullYear();return Math.floor((Date.UTC(y,dt.getMonth(),dt.getDate())-Date.UTC(y,0,0))/86400000)}
  function solar(dt){
    const n=dayOfYear(dt), gamma=2*Math.PI/365*(n-1+(dt.getHours()-12)/24);
    const eq=229.18*(0.000075+0.001868*Math.cos(gamma)-0.032077*Math.sin(gamma)-0.014615*Math.cos(2*gamma)-0.040849*Math.sin(2*gamma));
    const decl=0.006918-0.399912*Math.cos(gamma)+0.070257*Math.sin(gamma)-0.006758*Math.cos(2*gamma)+0.000907*Math.sin(2*gamma)-0.002697*Math.cos(3*gamma)+0.00148*Math.sin(3*gamma);
    return {eq,decl};
  }
  function hoursForAngle(angle,dt){
    const s=solar(dt), phi=d2r(LAT);
    const a=d2r(angle), cs=(Math.sin(a)-Math.sin(phi)*Math.sin(s.decl))/(Math.cos(phi)*Math.cos(s.decl));
    if(cs<=-1||cs>=1)return null;
    return r2d(Math.acos(cs))/15;
  }
  function calc(){
    const now=new Date();
    const local=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Jakarta'}));
    const s=solar(local), tzMeridian=15*TZ;
    const noon=12+(tzMeridian-LNG)/15-s.eq/60;
    const rise=hoursForAngle(-0.833,local), fajr=hoursForAngle(-20,local), isha=hoursForAngle(-18,local);
    const sunsetOffset=rise;
    // Asr Shafi'i: altitude angle derived from one shadow length.
    const phi=d2r(LAT), decl=s.decl, latElev=Math.tan(Math.abs(phi-decl));
    const asrAlt=r2d(Math.atan(1/(1+latElev)));
    const asrH=hoursForAngle(asrAlt,local);
    const out={
      fajr:noon-(fajr||0)/1, sunrise:noon-(sunsetOffset||0)/1, dhuhr:noon,
      asr:noon+(asrH||0), sunset:noon+(sunsetOffset||0), isha:noon+(isha||0)
    };
    return {now, local,out};
  }
  function fmt(h){
    if(h==null)return '—';
    h=(h+24)%24; const hh=Math.floor(h), mm=Math.round((h-hh)*60);
    return String(hh%24).padStart(2,'0')+':'+String(mm%60).padStart(2,'0');
  }
  function islamicDate(dt){
    try{
      const x=new Intl.DateTimeFormat('id-ID-u-ca-islamic', {day:'numeric',month:'long',year:'numeric'}).format(dt);
      return x.replace(' ', ' ').replace(/(\d{4})/,'$1H');
    }catch{return ''}
  }
  function render(){
    const {now,out}=calc();
    const values=[out.fajr,out.sunrise,out.dhuhr,out.asr,out.sunset,out.isha];
    const labels=names.map(x=>x[0]);
    const tNow=now.getHours()+now.getMinutes()/60;
    let nextIndex=-1;
    for(let i=0;i<values.length;i++){if(values[i]>tNow){nextIndex=i;break}}
    elTimes.innerHTML=labels.map((label,i)=>`<div class="prayer-item ${i===nextIndex?'next':''}" role="listitem"><span class="name">${label}</span><span class="time">${fmt(values[i])}</span></div>`).join('');
    if(nextIndex<0) nextIndex=0;
    elNext.textContent=labels[nextIndex]+' · '+fmt(values[nextIndex]);
    const id=islamicDate(now);
    if(id) elDate.textContent='Jero Tengah · '+id;
  }
  render(); setInterval(render,60000);
})();
</script>
</body></html>
