<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Menu • PCM Somagede</title><meta name="robots" content="noindex"><style>:root{--n:#062653;--b:#075aa4;--t:#0b7e8d;--g:#ffd33d;--bg:#f3f8fc;--ink:#092b55;--line:#d7e5ef}*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,Arial;color:var(--ink);background:radial-gradient(circle at 10% 0,#e8f8ff,#f3f8fc 45%,#eef5fa)}header{background:linear-gradient(120deg,#062653,#0872a5,#0b8f86);color:#fff;padding:28px 18px 24px;position:relative;overflow:hidden}header:after{content:'۞';position:absolute;right:6%;top:-25px;font:150px/1 serif;opacity:.12}header>*{position:relative;z-index:1;max-width:1080px;margin-left:auto;margin-right:auto}header h1{margin:0 0 5px;font-size:clamp(1.55rem,4vw,2.35rem)}header p{margin:0;opacity:.88}.wrap{max-width:1080px;margin:22px auto;padding:0 14px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}.toolbar button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 5px 18px #073b6414}.toolbar .primary{background:var(--g)}.notice{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin-bottom:16px}.group{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #073b6410}.group h2{margin:0 0 12px}.item{display:grid;grid-template-columns:1.2fr 1.6fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #edf2f6}.item:first-of-type{border-top:0}.item input{width:100%;border:1px solid #cfdeea;border-radius:9px;padding:9px;font:inherit}.item button{border:1px solid #e2c6c6;background:#fff4f4;color:#a33b3b;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer}.handle{font-weight:900}.hint{font-size:.82rem;color:#6a8093}.status{font-weight:800;color:#08736f}@media(max-width:680px){.item{grid-template-columns:1fr auto}.item input:nth-child(2),.item input:nth-child(3){grid-column:1/-1}.item button{grid-column:2;grid-row:1}.wrap{padding:0 10px}}</style></head><body><header><h1>Editor Menu</h1><p>Atur nama, tujuan, urutan, dan visibilitas menu dari satu tempat.</p></header><div class="wrap"><div class="toolbar"><button class="primary" id="save">Simpan di perangkat</button><button id="reset">Kembalikan bawaan</button><button id="export">Ekspor JSON</button><label><button type="button" onclick="document.getElementById('import').click()">Impor JSON</button><input id="import" type="file" accept="application/json" hidden></label></div><div class="notice">Editor ini tidak menghapus isi situs secara permanen dari GitHub. Konfigurasi yang disimpan di sini berlaku pada perangkat/browser ini dan dapat diekspor untuk dipindahkan ke perangkat lain. <span class="status" id="status"></span></div><div id="app"></div></div><script>const KEY='pcm-menu-editor-v1';const DEFAULT=[{name:'BeritaMu',items:[['Profil Pimpinan','profil'],['Kajian Rutin','kajian'],['Agenda Persyarikatan','agenda'],['Susunan Lengkap','struktur']]},{name:'PustakaMu',items:[['KhutbahMu','khutbah'],['BukuMu','buku'],['HaditsMu','hadits'],['Al-Qur’anMu','quran']]},{name:'ArsipMu',items:[['Pedoman Surat','pedoman'],['Surat Masuk','masuk'],['Surat Keluar','keluar'],['Lampiran Surat Keluar','lampiran-keluar'],['Dokumen Lainnya','dokumen-lainnya'],['Data Wakaf','wakaf']]}];let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(DEFAULT);const app=document.getElementById('app');const status=document.getElementById('status');function render(){app.innerHTML='';data.forEach((g,gi)=>{const sec=document.createElement('section');sec.className='group';sec.innerHTML='<h2>'+g.name+'</h2>';g.items.forEach((it,ii)=>{const row=document.createElement('div');row.className='item';row.innerHTML='<span class="handle">'+(ii+1)+'.</span><input value="'+esc(it[0])+'" aria-label="Nama menu"><input value="'+esc(it[1])+'" aria-label="ID tujuan"><button type="button">Hapus</button>';const ins=row.querySelectorAll('input');ins[0].oninput=()=>g.items[ii][0]=ins[0].value;ins[1].oninput=()=>g.items[ii][1]=ins[1].value;row.querySelector('button').onclick=()=>{g.items.splice(ii,1);render()};sec.appendChild(row)});app.appendChild(sec)})}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}document.getElementById('save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(data));status.textContent=' • tersimpan';setTimeout(()=>status.textContent='',1800)};document.getElementById('reset').onclick=()=>{if(confirm('Kembalikan menu bawaan?')){data=structuredClone(DEFAULT);localStorage.removeItem(KEY);render()}};document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='menu-pcm-somagede.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);render();status.textContent=' • diimpor'}catch{alert('JSON tidak valid')}};r.readAsText(f)};render();</script></body></html>
