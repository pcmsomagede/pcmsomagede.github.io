name: Build TafsirMu Assets

on:
  push:
    paths:
      - 'data/tafsir-40-targets.json'
      - 'scripts/build_tafsir_release_v3.py'
      - 'tafsirmu-final.js'
      - '.github/workflows/build-tafsir-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install --upgrade pip
          python -m pip install requests pypdf pymupdf python-docx

      - name: Build 40 TafsirMu books
        run: python scripts/build_tafsir_release_v3.py

      - name: Publish TafsirMu covers and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tafsir-assets.json media/tafsir-covers
          git diff --cached --quiet || git commit -m 'Publish TafsirMu 40-book manifest and covers'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish TafsirMu PDF DOCX release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tafsirmu-latest
          name: TafsirMu Latest
          body: Koleksi 40 kitab TafsirMu — PDF dan DOCX.
          files: build/tafsirmu-release/*
          overwrite_files: true
          make_latest: false
