name: Build TafsirMu Assets

on:
  push:
    paths:
      - 'data/pustaka-tafsir.json'
      - 'scripts/build_tafsir_assets.py'
      - '.github/workflows/build-tafsir-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install --upgrade pip
          python -m pip install requests pypdf pymupdf python-docx

      - name: Build verified TafsirMu assets
        run: python scripts/build_tafsir_assets.py

      - name: Publish asset manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tafsir-assets.json media/tafsir
          git diff --cached --quiet && exit 0
          git commit -m 'Build verified TafsirMu PDF DOCX and covers'
          git pull --rebase origin main
          git push origin HEAD:main
