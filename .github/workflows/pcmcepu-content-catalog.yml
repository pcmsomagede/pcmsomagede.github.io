name: Build PCM Cepu content catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pcmcepu_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/build_pcmcepu_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "PCM Somagede Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pcmcepu-content.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update PCM Cepu content catalog [skip ci]"
          git push
