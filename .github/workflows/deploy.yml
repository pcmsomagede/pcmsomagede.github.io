name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply visual layers and ticker
        shell: bash
        run: |
          set -e
          if ! grep -q 'VISUAL-UPGRADE-V9' style.css; then printf '\n/* VISUAL-UPGRADE-V9 */\n' >> style.css; cat visual-upgrade-v9.css >> style.css; fi
          if ! grep -q 'TICKER-V22' style.css; then printf '\n/* TICKER-V22 */\n' >> style.css; cat ticker-v22.css >> style.css; fi
          printf '\n/* TICKER-V24-AUTHORITATIVE */\n' >> style.css
          cat ticker-v24.css >> style.css
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='PCM Somagede • Kabupaten Banyumas &nbsp; • &nbsp; Hidup-hiduplah Muhammadiyah &nbsp; • &nbsp; Carilah penghidupan yang layak untuk menghidupi Muhammadiyah'
          new='PCM Somagede Kabupaten Banyumas Jawa Tengah. &nbsp; • &nbsp; Hidup hidupilah Muhammadiyah. &nbsp; • &nbsp; Carilah penghidupan yang layak untuk menghidupkan Muhammadiyah di masa yang akan datang (KH. Ahmad Dahlan).'
          s=s.replace(old,new)
          # TafsirMu must have exactly one renderer: the authoritative one.
          s=re.sub(r'<script[^>]+src=["\'][^"\']*(?:tafsir|pustaka-tafsir)[^"\']*["\'][^>]*></script>', '', s, flags=re.I)
          s=re.sub(r'<script[^>]+id=["\']pcm-tafsir-authoritative["\'][^>]*></script>', '', s, flags=re.I)
          tag='<script id="pcm-tafsir-authoritative" src="/tafsirmu-authoritative.js?v=20260829-06"></script>'
          if '</body>' not in s:
              raise SystemExit('index.html has no closing body tag')
          s=s.replace('</body>', tag+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
          test -f tafsirmu-authoritative.js
          grep -q 'resolvePdf' tafsirmu-authoritative.js
          grep -q 'archive.org/metadata' tafsirmu-authoritative.js
          grep -q 'tafsirmu-authoritative.js?v=20260829-06' index.html
          ! grep -Eiq 'pustaka-tafsir-live|tafsirmu-final|tafsirmu-rescue|tafsirmu-static' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
