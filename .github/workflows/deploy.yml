name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V9 content visual layer and V22 ticker
        shell: bash
        run: |
          set -e
          if ! grep -q 'VISUAL-UPGRADE-V9' style.css; then
            printf '\n/* VISUAL-UPGRADE-V9 */\n' >> style.css
            cat visual-upgrade-v9.css >> style.css
          fi
          if ! grep -q 'TICKER-V22' style.css; then
            printf '\n/* TICKER-V22 */\n' >> style.css
            cat ticker-v22.css >> style.css
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'PCM Somagede • Kabupaten Banyumas &nbsp; • &nbsp; Hidup-hiduplah Muhammadiyah &nbsp; • &nbsp; Carilah penghidupan yang layak untuk menghidupi Muhammadiyah'
          new = 'PCM Somagede Kabupaten Banyumas Jawa Tengah. &nbsp; • &nbsp; Hidup hidupilah Muhammadiyah. &nbsp; • &nbsp; Carilah penghidupan yang layak untuk menghidupkan Muhammadiyah di masa yang akan datang (KH. Ahmad Dahlan).'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Force authoritative V24 ticker layer
        shell: bash
        run: |
          set -e
          printf '\n/* TICKER-V24-AUTHORITATIVE */\n' >> style.css
          cat ticker-v24.css >> style.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
