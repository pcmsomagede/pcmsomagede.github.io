name: Refresh site asset versions

on:
  push:
    branches: [main]
    paths:
      - 'tools/refresh_index_assets.py'
      - 'fast-ui.js'
      - 'quran-ui.js'
      - 'arsip-ui.js'
      - 'arsip-preview.js'
      - 'manifest.webmanifest'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/refresh_index_assets.py
      - name: Commit index
        run: |
          git config user.name "PCM Somagede Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh site asset versions [skip ci]"
          git push
