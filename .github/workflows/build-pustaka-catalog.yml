name: Build PustakaMu catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pustaka_catalog_v5.py'
      - 'tools/repair_khutbah_exports.py'
      - 'tools/pustaka_catalog_guard.py'
      - 'data/pustaka-books.json'
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pustaka-catalog-v5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arabic-capable PDF stack
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf python-docx weasyprint
      - name: Build real PustakaMu catalog
        env:
          PUSTAKA_MAX_ITEMS: '1000000'
          PUSTAKA_LOCAL_MAX_MB: '25'
        run: python tools/build_pustaka_catalog_v5.py
      - name: Repair and verify Arabic Khutbah exports
        run: python tools/repair_khutbah_exports.py
      - name: Validate catalog records
        run: python tools/pustaka_catalog_guard.py
      - name: Commit generated catalog and assets safely
        run: |
          git config user.name "PCM Somagede Pustaka Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pustaka-catalog.json assets/pustaka-files assets/pustaka-covers assets/pustaka-docx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild PustakaMu with Arabic-safe Khutbah previews [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
