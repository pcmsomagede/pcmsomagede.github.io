name: Build PustakaMu catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pustaka_catalog_v2.py'
      - 'tools/pustaka_catalog_guard.py'
      - 'data/pustaka-books.json'
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pustaka-catalog-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf
      - name: Build strict PustakaMu catalog
        env:
          PUSTAKA_MAX_ITEMS: '1000000'
        run: |
          python tools/build_pustaka_catalog_v2.py
          python tools/pustaka_catalog_guard.py
      - name: Commit catalog and local covers safely
        run: |
          git config user.name "PCM Somagede Pustaka Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pustaka-catalog.json assets/pustaka-covers
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build strict PustakaMu catalog and covers [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
