name: Build PustakaMu catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pustaka_catalog.py'
      - 'data/pustaka-books.json'
      - 'pustaka-ui.js'
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pustaka-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build and migrate PustakaMu assets
        env:
          CLOUDINARY_CLOUD_NAME: v6hqki7m
          CLOUDINARY_UPLOAD_PRESET: pcmsomagede_document
          PUSTAKA_MAX_ITEMS: '180'
        run: python tools/build_pustaka_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "PCM Somagede Pustaka Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pustaka-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build PustakaMu catalog [skip ci]"
          git push
