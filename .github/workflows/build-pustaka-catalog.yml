name: Build PustakaMu catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pustaka_catalog.py'
      - 'data/pustaka-books.json'
      - 'pustaka-modern-v4.js'
      - 'document-viewer-v2.js'
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pustaka-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdf2docx
      - name: Build and migrate PustakaMu assets
        env:
          CLOUDINARY_CLOUD_NAME: v6hqki7m
          CLOUDINARY_UPLOAD_PRESET: pcmsomagede_document
          PUSTAKA_MAX_PAGES: '1000'
          PUSTAKA_MAX_ITEMS: '100000'
          PUSTAKA_GENERATE_DOCX: '1'
        run: python tools/build_pustaka_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "PCM Somagede Pustaka Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pustaka-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build PustakaMu catalog [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
