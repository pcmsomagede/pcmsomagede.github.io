name: Apply visual V8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-visual-v8
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Append V8 visual layer
        shell: bash
        run: |
          set -e
          if ! grep -q 'VISUAL-UPGRADE-V8' style.css; then
            printf '\n/* VISUAL-UPGRADE-V8 */\n' >> style.css
            cat visual-upgrade.css >> style.css
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add style.css
            git commit -m 'Apply V8 full-page transparent visual system'
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
