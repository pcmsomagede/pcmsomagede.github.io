name: Apply visual V8

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-visual-v8
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Append V8 visual layer
        shell: bash
        run: |
          set -e
          changed=0
          if ! grep -q 'VISUAL-UPGRADE-V8' style.css; then
            printf '\n/* VISUAL-UPGRADE-V8 */\n' >> style.css
            cat visual-upgrade.css >> style.css
            changed=1
          fi
          if ! grep -q 'TICKER-V22' style.css; then
            printf '\n/* TICKER-V22 */\n' >> style.css
            cat ticker-v22.css >> style.css
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+users.noreply.github.com'
            git add style.css
            git commit -m 'Apply V22 continuous ticker styling'
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
