name: Enable fast navigation
on:
  push:
    branches: [main]
    paths:
      - 'fast-ui.js'
      - '.github/workflows/enable-fast-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fast UI before closing body
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="fast-ui.js" defer></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'PCM Somagede Fast UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable instant navigation UI [skip ci]'
          git push
