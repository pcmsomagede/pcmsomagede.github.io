name: Fix TafsirMu Menu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tafsirmu-deploy
  cancel-in-progress: true
jobs:
  patch-menu-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install authoritative TafsirMu as the only Tafsir renderer
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove every external Tafsir/Pustaka-Tafsir renderer, including old v1-v4/live/final/rescue scripts.
          s=re.sub(r'<script[^>]+src=["\'][^"\']*(?:tafsir|pustaka-tafsir)[^"\']*["\'][^>]*></script>', '', s, flags=re.I)
          # Remove previous authoritative tags so only one fresh, cache-busted loader remains.
          s=re.sub(r'<script[^>]+id=["\']pcm-tafsir-authoritative["\'][^>]*></script>', '', s, flags=re.I)
          tag='<script id="pcm-tafsir-authoritative" src="/tafsirmu-authoritative.js?v=20260829-06"></script>'
          if '</body>' not in s:
              raise SystemExit('index.html has no closing body tag')
          s=s.replace('</body>', tag+'</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          test -f tafsirmu-authoritative.js
          grep -q 'PDF ASLI' tafsirmu-authoritative.js
          grep -q 'pcm-tafsir-authoritative' index.html
          # Make sure the generated artifact contains no legacy Tafsir renderer reference.
          ! grep -Eiq 'pustaka-tafsir-live|tafsirmu-final|tafsirmu-rescue|tafsirmu-static' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload patched site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy TafsirMu fix
        id: deployment
        uses: actions/deploy-pages@v4
