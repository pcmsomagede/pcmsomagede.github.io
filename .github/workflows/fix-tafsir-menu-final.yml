name: Fix TafsirMu Menu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  patch-menu-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install only the authoritative TafsirMu route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script[^>]+src=["\'][^"\']*(?:tafsirmu|pustaka-tafsir)[^"\']*["\'][^>]*></script>','',s,flags=re.I)
          s=re.sub(r'<script id=["\']pcm-tafsir-direct-fix["\'][\s\S]*?</script>','',s,flags=re.I)
          tag='<script id="pcm-tafsir-authoritative" src="tafsirmu-authoritative.js?v=20260829-04"></script>'
          s=s.replace(tag,'')
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit route if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make TafsirMu authoritative renderer last"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy TafsirMu fix
        id: deployment
        uses: actions/deploy-pages@v4
