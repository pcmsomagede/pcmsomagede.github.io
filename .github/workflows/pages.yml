name: Deploy PCM Somagede Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build final static site
        run: |
          test -f index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="site-overrides.css">'
          js='<script src="site-overrides.js" defer></script>'
          sw='<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>'
          art='<script>window.addEventListener("DOMContentLoaded",()=>{const h=document.querySelector(".hero");if(h&&!h.querySelector(".pcm-header-art")){h.style.background="none";const i=document.createElement("img");i.className="pcm-header-art";i.src="header-bg.jpg";i.alt="Header PCM Somagede";h.prepend(i)}});</script>'
          if css not in s: s=s.replace('</head>',css+'\n</head>')
          if js not in s: s=s.replace('</body>',js+'\n</body>')
          if 'serviceWorker.register("./sw.js")' not in s: s=s.replace('</body>',sw+'\n</body>')
          if 'pcm-header-art' not in s: s=s.replace('</body>',art+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'site-overrides.css' index.html
          grep -q 'site-overrides.js' index.html
          grep -q 'pcm-header-art' index.html
          echo "PCM Somagede final build: $(git rev-parse --short HEAD)"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
